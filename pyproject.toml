[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vaultkeep"
version = "1.0.0"
description = "Encrypted password and file vault with shared, role-based access"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Muhammad Faiz Ur Rehman" }]
license = { text = "MIT" }
dependencies = [
    "cryptography>=42",
    "argon2-cffi>=23.1",
    "click>=8.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
vaultkeep = "vaultkeep.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
